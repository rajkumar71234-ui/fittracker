<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minimal Health">
<meta name="theme-color" content="#eef3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Minimal Health Tracker</title>
<style>
:root{
  --bg:#eef3fa;--card:#ffffff;--text:#0f1c2e;--muted:#5d6b80;--line:#dfe6f0;--input:#f2f6fc;
  --accent:#15803d;--accent-soft:#e3f5e9;--blue:#2563eb;--blue-dark:#1d4fd8;--blue-soft:#e3ecfd;--warn:#b45309;--warn-soft:#fef3c7;
  --bad:#d92d20;--bad-soft:#fde8e6;--head:#1e3a8a;--shadow:0 1px 2px rgba(15,28,46,.04),0 4px 14px rgba(37,99,235,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#141d2f;--text:#e9eef7;--muted:#97a6bd;--line:#24314a;--input:#1c2740;
  --accent:#34d399;--accent-soft:#0f2e24;--blue:#4f8cff;--blue-dark:#3b7bff;--blue-soft:#1a2b4f;--warn:#fbbf24;--warn-soft:#3a2a08;
  --bad:#f87171;--bad-soft:#3b1515;--head:#bcd0ff;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
/* keep the bottom tab bar still on iPhone: the page scrolls inside #app, not the whole window */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0}
small,.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
.top-in{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;gap:8px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--head)}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.logo-btn{position:relative;width:40px;height:40px;border-radius:11px;overflow:visible;flex:none}
.logo-btn img{width:40px;height:40px;border-radius:11px;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.logo-btn .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.logo-btn .dot.ok{background:var(--accent)}.logo-btn .dot.saving{background:var(--blue)}.logo-btn .dot.err{background:var(--bad)}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--input);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--blue-soft);color:var(--blue-dark)}
.pill.saving{background:var(--blue-soft);color:var(--blue)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:17px;font-weight:700;color:var(--head);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:500;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--input);border-radius:14px;padding:10px 12px;min-width:0}
.stat small{display:block;font-size:12px}
.stat b{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.good{color:var(--accent)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.good{background:var(--accent-soft)} .tag.bad{background:var(--bad-soft)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--text);background:var(--input);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:70px;resize:vertical}
input:not([type=checkbox]),select{height:48px;line-height:24px}
input[type=date]{text-align:left;-webkit-appearance:none;appearance:none;min-width:0;display:block;padding-left:9px;padding-right:6px;font-size:15px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
.grid2>label,.grid3>label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid2,.grid3{align-items:end}
.field{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:13px;font-weight:650;background:var(--blue);color:#fff;text-align:center;box-shadow:0 2px 8px rgba(37,99,235,.22)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn.orange{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.quick{padding:4px 16px}
.q-sec{padding:14px 0}
.q-sec + .q-sec{border-top:1px solid var(--line)}
.q-h{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.q-h b{font-size:16px;white-space:nowrap}
.q-h small{font-size:13px}
.photo-btns label.btn.orange{color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--input);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 4px;white-space:nowrap;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;width:100%;max-width:640px}
.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:25px;height:25px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.datebar button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:22px;box-shadow:var(--shadow)}
.datebar button:disabled{opacity:.35}
.datebar div{text-align:center}
.datebar b{display:block;font-size:17px}
.datebar small{font-size:13px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.sum-grid small{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sum-grid b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
.sum-grid span{font-size:12px;color:var(--muted)}
.sum-grid.four{grid-template-columns:repeat(4,1fr);gap:4px}
.sum-grid.four b{font-size:21px}
.sum-grid.four small{font-size:11px;letter-spacing:.02em;white-space:nowrap}
.sum-foot{text-align:center;margin-top:10px;font-size:14px;font-weight:600}
details summary{cursor:pointer;color:var(--blue);font-size:14px;font-weight:600;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
.explain{font-size:13px;color:var(--muted);margin-top:6px}
.explain div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.slot{padding:10px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0;padding-top:0}
.slot-h{display:flex;align-items:center;gap:8px}
.slot-h .name{font-weight:650;flex:1}
.slot-h .kc{font-size:14px;color:var(--muted)}
.add{color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:10px;background:var(--blue)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin-top:6px;border-radius:12px;background:var(--input);color:var(--text);font-size:15px}
.li small{font-size:13px}
.li .r{font-weight:650;white-space:nowrap}
.li-wrap{flex-wrap:wrap;row-gap:6px}
.mcs{flex-basis:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mc{display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;min-width:0}
.mc small{font-size:10.5px!important;line-height:1.2}
.mc b{font-size:13px;font-weight:700;color:var(--text);line-height:1.25}
.mc.good{background:var(--accent-soft);color:var(--accent)}.mc.good b{color:var(--accent)}
.mc.bad{background:var(--bad-soft);color:var(--bad)}.mc.bad b{color:var(--bad)}
.water{display:flex;align-items:center;gap:12px}
.water .big{flex:1;text-align:center}
.water .big b{font-size:28px;font-weight:800}
.round{width:46px;height:46px;border-radius:50%;background:var(--blue-soft);color:var(--blue-dark);font-size:24px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--input);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.blue i{background:var(--blue)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hero .w{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .w span{font-size:18px;font-weight:600;color:var(--muted)}
.note{padding:10px 12px;border-radius:12px;font-size:14px;margin-top:10px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--blue-soft);color:var(--blue)}
.note.good{background:var(--accent-soft);color:var(--accent)}
.proj{font-size:15px}
.proj b.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:right;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log th:first-child,table.log td:first-child{text-align:left}
table.log tr{cursor:pointer}
table.fit{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.fit th,table.fit td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top;white-space:normal;word-break:break-word}
table.fit th{color:var(--muted);font-weight:600;font-size:12px}
table.fit td:first-child,table.fit th:first-child{text-align:left;font-weight:600;width:24%}
table.fit .tag{font-size:10px;padding:1px 6px;margin-top:3px}
table.today-t{font-size:12.5px}
table.today-t td:first-child,table.today-t th:first-child{width:23%;word-break:normal;overflow-wrap:normal;hyphens:none}
table.today-t td:last-child,table.today-t th:last-child{width:19%}
.big2{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--input);font-size:14px;font-weight:600;color:var(--text)}
.chip.on{background:var(--blue);color:#fff}
.chip input{display:none}
.chip:has(input:checked){background:var(--blue);color:#fff}
.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h2{font-size:20px;font-weight:750}
.x{width:32px;height:32px;border-radius:50%;background:var(--input);color:var(--muted);font-size:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.item-edit{background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px}
.item-edit .mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.item-edit .mini label{font-size:11px}
.item-edit .mini input{padding:8px 6px;font-size:15px;text-align:center}
.photo-prev{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-btns label{color:#fff;font-size:15px}
.photo-btns label.btn.primary,.photo-btns label.btn.blue{color:#fff}
.photo-btns label{position:relative;overflow:hidden}
.photo-btns.three{grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo-btns.three .btn{padding:12px 6px;font-size:14px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.slot-tile{position:relative;border:2px dashed var(--line);border-radius:16px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--card);padding:8px;text-align:center}
.slot-tile.filled{border:0;padding:0;overflow:hidden}
.slot-tile.filled img{width:100%;height:100%;object-fit:cover;display:block}
.slot-tile b{font-size:13px}.slot-tile small{font-size:11px;color:var(--muted)}
.fileb{position:relative;overflow:hidden;display:block;width:100%;padding:8px 6px;border-radius:10px;background:var(--blue);font-weight:650;font-size:13px;color:#fff}
.fileb.primary{background:var(--blue);color:#fff}
.fileb input,.slot-tile label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;font-size:0}
.photo-btns input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;font-size:0}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.auth{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 16px 40px}
.logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 12px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.auth h1{text-align:center;font-size:30px;font-weight:800}
.auth p.sub{text-align:center;color:var(--muted);margin:4px 0 22px}
.help{font-size:14px;color:var(--muted)}
.help ol{padding-left:20px;margin:6px 0}
.help li{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{background:var(--bad)}
.toast.good{background:#15803d}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-weight:600;text-align:right;word-break:break-all}
.machines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.machine{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;line-height:1.2}
.machine .ic{font-size:24px;display:block;margin-bottom:4px}
.machine.on{background:var(--blue);color:#fff}
.sugg{font-size:14px;margin:6px 0 2px}
.section-label{font-size:13px;font-weight:700;color:var(--head);opacity:.8;text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
</style>
</head>

<div id="app"></div>
<div id="sheet-root"></div>

  const row = (label, need, eaten, u, lim) => {
    const left = need - eaten;
    return `<tr><td>${label}</td><td><b>${lim ? '≤ ' : ''}${r0(need)} ${u}</b></td><td>${r0(eaten)} ${u}</td><td class="${lim ? (left < 0 ? 'bad' : 'good') : (left <= 0 ? 'good' : '')}">${lim ? (left < 0 ? `${r0(-left)} over` : `${r0(left)} left`) : (left <= 0 ? 'Done ✓' : `${r0(left)} ${u}`)}</td></tr>`;
  };
  const tips = [];
  if (nd.strMin) tips.push(`Strength day: eat 25–30 g protein within 1–2 hours after your workout (eggs, whey, paneer, chicken, sundal).`);
  if (nd.cardioMin >= 45) tips.push(`Long cardio (${nd.cardioMin} min): have some carbs after — fruit, idli or rice — so you don't feel weak.`);
  if (nd.exMin) tips.push(`Drink about ${r1(nd.exMin / 30 * 0.5)} L extra water for your ${nd.exMin} minutes of exercise.`);
  if (nd.diabetes) tips.push('Sugar limit is lower (5% of calories) because of the sugar/diabetes note in your profile.');
  if (!tips.length) tips.push('Add your workout above and these numbers will update for it.');
  return `<div class="section-label">What your body needs today</div>
  <div class="card" style="padding:12px">
    <p class="explain" style="margin:2px 4px 8px">For <b>${r1(nutritionNeeds(date).kcal ? dayStats(date).w : 0)} kg</b> body weight and <b>${esc(nd.kind)}</b> today → protein <b>${nd.gpk} g per kg</b>.</p>
    <table class="fit">
      <thead><tr><th></th><th>Need</th><th>Eaten</th><th>Left</th></tr></thead>
      <tbody>
        ${row('Calories', nd.kcal, t.kcal, 'kcal')}
        ${row('Protein', nd.protein, t.protein, 'g')}
        ${row('Carbs', nd.carbs, t.carbs, 'g')}
        ${row('Sugar', nd.sugar, t.sugar, 'g', true)}
        ${row('Fat', nd.fat, t.fat, 'g')}
        ${row('Fibre', nd.fiber, t.fiber, 'g')}
        <tr><td>Water</td><td><b>${nd.water} L</b></td><td colspan="2" class="muted" style="font-size:12px">35 ml per kg + 0.5 L per 30 min exercise</td></tr>
      </tbody>
    </table>
    ${tips.map(x => `<p style="margin:8px 4px 0;font-size:14px">• ${esc(x)}</p>`).join('')}
  </div>`;
}

/* ================================================================
   BASE64 / CRYPTO
   ================================================================ */
function bytesToB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBytes(b64) { const bin = atob(String(b64).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const utf8ToB64 = s => bytesToB64(new TextEncoder().encode(s));
const b64ToUtf8 = b => new TextDecoder().decode(b64ToBytes(b));

const PBKDF2_ITER = 310000;
async function deriveKey(password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptVault(obj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt, PBKDF2_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: PBKDF2_ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function decryptVault(v, password) {
  const key = await deriveKey(password, b64ToBytes(v.salt), v.iter || PBKDF2_ITER);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(v.iv) }, key, b64ToBytes(v.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================================================================
   GITHUB STORAGE
   ================================================================ */
const GH = {
  async call(path, { method = 'GET', token, body } = {}) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    if (body) headers['Content-Type'] = 'application/json';
    try {
      return await fetch('https://api.github.com' + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    } catch (e) { const err = fail('No internet connection — could not reach GitHub.'); err.offline = true; throw err; }
  },
  async error(res) {
    let m = ''; try { m = (await res.json()).message || ''; } catch (e) {}
    const map = { 401: 'GitHub token is invalid or expired.', 403: 'GitHub refused (token permission or rate limit).', 404: 'Not found on GitHub — check the user/repo names and that the token has access to that repo.' };
    const e = fail((map[res.status] || ('GitHub error ' + res.status)) + (m && !map[res.status] ? ' — ' + m : ''));
    e.status = res.status; e.ghMessage = m; return e;
  },
  path: p => p.split('/').map(encodeURIComponent).join('/'),
  async get(owner, repo, p, token) {
    const res = await this.call(`/repos/${owner}/${repo}/contents/${this.path(p)}`, { token });
    if (res.status === 404) return null;
    if (!res.ok) throw await this.error(res);
    const j = await res.json();
    return { sha: j.sha, text: b64ToUtf8(j.content || '') };
  },
  async put(owner, repo, p, text, sha, message, token) {
    const body = { message, content: utf8ToB64(text) }; if (sha) body.sha = sha;
    const res = await this.call(`/repos/${owner}/${repo}/contents/${this.path(p)}`, { method: 'PUT', token, body });
    if (!res.ok) throw await this.error(res);
    return (await res.json()).content.sha;
  },
  async putB64(owner, repo, p, b64, message, token) {
    const res = await this.call(`/repos/${owner}/${repo}/contents/${this.path(p)}`, { method: 'PUT', token, body: { message, content: b64 } });
    if (!res.ok) throw await this.error(res);
    return (await res.json()).content.sha;
  },
  async getB64(owner, repo, p, token) {
    const res = await this.call(`/repos/${owner}/${repo}/contents/${this.path(p)}`, { token });
    if (!res.ok) throw await this.error(res);
    const j = await res.json();
    if (j.content) return String(j.content).replace(/\s/g, '');
    if (j.download_url) { const r = await fetch(j.download_url, { headers: { Authorization: 'Bearer ' + token } }); const b = new Uint8Array(await r.arrayBuffer()); return bytesToB64(b); }
    return '';
  },
  async repo(owner, repo, token) {
    const res = await this.call(`/repos/${owner}/${repo}`, { token });
    if (!res.ok) throw await this.error(res);
    return res.json();
  },
};

// When hosted on https://OWNER.github.io/REPO/ we can work out where the app lives.
function siteRepo() {
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  if (!m) return null;
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner: m[1], repo: seg && !seg.includes('.') ? seg : `${m[1]}.github.io` };
}

/* ================================================================
   CALCULATIONS
   ================================================================ */
function bmiOf(w, hcm) { return w / Math.pow(hcm / 100, 2); }
function bmiCat(b) { // Asian-Indian cut-offs (ICMR / WHO Asia-Pacific)
  if (b < 18.5) return ['Underweight', 'warn'];
  if (b < 23) return ['Normal', 'good'];
  if (b < 25) return ['Overweight', 'warn'];
  return ['Obese', 'bad'];
}
function fatPct(p, w) {
  const h = p.heightCm, waist = p.waistCm, neck = p.neckCm, hip = p.hipCm;
  if (p.sex === 'male' && waist && neck && waist > neck)
    return { pct: 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(h)) - 450, method: 'US Navy tape method' };
  if (p.sex === 'female' && waist && neck && hip && waist + hip > neck)
    return { pct: 495 / (1.29579 - 0.35004 * Math.log10(waist + hip - neck) + 0.22100 * Math.log10(h)) - 450, method: 'US Navy tape method' };
  return { pct: 1.2 * bmiOf(w, h) + 0.23 * p.age - 10.8 * (p.sex === 'male' ? 1 : 0) - 5.4, method: 'BMI + age formula (Deurenberg)' };
}
function bmr(p, w) { return 10 * w + 6.25 * p.heightCm - 5 * p.age + (p.sex === 'male' ? 5 : -161); } // Mifflin-St Jeor

function treadKcal(kmh, inclinePct, min, kg) { // ACSM metabolic equations, gross kcal
  const v = (kmh || 0) * 1000 / 60, g = (inclinePct || 0) / 100;
  const vo2 = (kmh < 6.5) ? 0.1 * v + 1.8 * v * g + 3.5 : 0.2 * v + 0.9 * v * g + 3.5;
  return vo2 * kg / 1000 * 5 * min;
}
function bikeKcal(watts, min, kg) { const vo2 = 1.8 * (watts * 6.12) / kg + 7; return vo2 * kg / 1000 * 5 * min; }
function wkSuggest(w, kg) {
  const m = WK[w.type], min = w.minutes || 0;
  if (!min) return 0;
  if (m.calc === 'tread') return treadKcal(w.speed || 0, m.incline ? (w.incline || 0) : 0, min, kg);
  if (m.calc === 'bike') return bikeKcal(w.watts || [50, 100, 150][w.intensity ?? 1], min, kg);
  if (m.calc === 'met') return m.mets[w.intensity ?? 1] * kg * min / 60;
  return w.kcal || 0;
}

function stepKcal(kg) { return 0.0005 * kg; } // ≈ kcal per step
function dayStats(date) {
  const p = P(), d = S.data.days[date] || {}, w = weightOn(date);
  const meals = d.meals || [];
  const sum = k => meals.reduce((a, m) => a + (Number(m[k]) || 0), 0);
  const intake = sum('kcal');
  const base = bmr(p, w) * 1.1;                    // resting + light daily life (steps counted separately)
  let exGross = 0, exNet = 0;
  (d.workouts || []).forEach(x => { exGross += x.kcal || 0; });
  exNet = exGross; // count the full workout kcal (as shown on the machine / entered)
  const stepsK = d.stepsKcal != null ? Number(d.stepsKcal) : (d.steps || 0) * stepKcal(w);
  const burn = base + exNet + stepsK;
  const logged = meals.length > 0;
  const exShow = exGross + stepsK;
  return { date, w, d, exShow, intake, protein: sum('protein'), carbs: sum('carbs'), fat: sum('fat'), base, exGross, exNet, stepsK, burn, logged, deficit: logged ? burn - intake : null };
}

function plan() {
  const p = P(), t = todayStr();
  const N = p.targetDays;
  const end = addDays(p.startDate, N - 1);
  const sinceStart = diffDays(p.startDate, t);
  const dayN = Math.min(N, Math.max(0, sinceStart + 1));
  const daysLeft = Math.max(0, diffDays(t, end));
  const targetW = p.startWeight - p.targetLoss;
  const reqDaily = p.targetLoss * KCAL_PER_KG / N;

  // cumulative deficit over completed (past) days that have food logged
  let cum = 0, loggedDays = 0, intakeSum = 0;
  const lastIdx = Math.min(sinceStart - 1, N - 1);
  for (let i = 0; i <= lastIdx; i++) {
    const st = dayStats(addDays(p.startDate, i));
    if (st.logged) { cum += st.deficit; loggedDays++; }
  }
  // recent average: last 7 completed logged days (within last 14 days); fall back to today
  const recent = [], recentIntake = [];
  for (let i = 1; i <= 14 && recent.length < 7; i++) {
    const ds = addDays(t, -i); if (ds < p.startDate) break;
    const st = dayStats(ds); if (st.logged) { recent.push(st.deficit); recentIntake.push(st.intake); }
  }
  let avgBasis = 'days';
  const todaySt = dayStats(t);
  if (!recent.length && todaySt.logged && t >= p.startDate) { recent.push(todaySt.deficit); recentIntake.push(todaySt.intake); avgBasis = 'today'; }
  const avg = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : null;
  const avgIntake = recentIntake.length ? recentIntake.reduce((a, b) => a + b, 0) / recentIntake.length : null;

  const curW = weightOn(t);
  const projByDeficit = avg != null ? curW - avg * daysLeft / KCAL_PER_KG : null;

  // weigh-in trend (linear regression)
  const pts = [];
  for (const k in S.data.days) { const v = S.data.days[k]; if (v && v.weight && k >= p.startDate && k <= t) pts.push({ x: diffDays(p.startDate, k), y: v.weight }); }
  if (!pts.some(q => q.x === 0)) pts.push({ x: 0, y: p.startWeight });
  pts.sort((a, b) => a.x - b.x);
  let trend = null, slopeWeek = null;
  if (pts.length >= 4 && pts[pts.length - 1].x - pts[0].x >= 7) {
    const n = pts.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
    pts.forEach(q => { sx += q.x; sy += q.y; sxx += q.x * q.x; sxy += q.x * q.y; });
    const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx), icpt = (sy - slope * sx) / n;
    trend = icpt + slope * (N - 1); slopeWeek = slope * 7;
  }

  const startFat = fatPct(p, p.startWeight);
  const startFatKg = p.startWeight * startFat.pct / 100;
  const fatKg = Math.max(0, startFatKg - cum / KCAL_PER_KG);
  const fatNowPct = fatKg / curW * 100;
  const needDaily = daysLeft > 0 ? (curW - targetW) * KCAL_PER_KG / daysLeft : null;

  return { N, end, dayN, sinceStart, daysLeft, targetW, reqDaily, cum, loggedDays, avg, avgBasis, recentN: recent.length, avgIntake,
    curW, projByDeficit, pts, trend, slopeWeek, startFat, startFatKg, fatKg, fatNowPct, needDaily, todayX: Math.min(N - 1, Math.max(0, sinceStart)) };
}

function writeOutbox() {

}
function applyOutbox() {
  const ob = LS.get(outboxKey()); if (!ob) return false;
  let any = false;
  for (const k in (ob.days || {})) { S.data.days[k] = ob.days[k]; S.dirtyDays.add(k); any = true; }
  if (ob.profile) { S.data.profile = ob.profile; S.profileDirty = true; any = true; }
  return any;
}
function setSync(state, msg) { S.sync = state; S.syncMsg = msg || ''; const el = $('#syncPill'); if (el) el.outerHTML = syncPill(); }
function scheduleSave(delay) {
  writeOutbox(); setSync('saving');
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(syncNow, delay == null ? 400 : delay);
}
async function syncNow() {
  clearTimeout(S.saveTimer); clearTimeout(S.retryTimer);
  if (!S.session || !S.data) return;
  if (!S.dirtyDays.size && !S.profileDirty) { setSync('ok'); return; }
  if (S.saving) { S.pendingSave = true; return; }
  S.saving = true; setSync('saving');
  const s = S.session;
  const dirtyNow = new Set(S.dirtyDays), profNow = S.profileDirty;
  const msg = 'Log ' + ([...dirtyNow].sort().join(', ') || 'profile');
  try {
    S.data.updated = new Date().toISOString();
    try {
      S.sha = await GH.put(s.owner, s.dataRepo, s.dataPath, JSON.stringify(S.data, null, 1), S.sha, msg, s.token);
    } catch (e) {
      if (e.status !== 409 && e.status !== 422) throw e;
      // someone (another device) saved first → merge our changed days on top of theirs
      const remote = await GH.get(s.owner, s.dataRepo, s.dataPath, s.token);
      if (remote) {
        const rd = JSON.parse(remote.text); rd.days = rd.days || {};
        dirtyNow.forEach(k => { rd.days[k] = S.data.days[k]; });
        if (profNow) rd.profile = S.data.profile;
        S.data = rd;
      }
      S.sha = await GH.put(s.owner, s.dataRepo, s.dataPath, JSON.stringify(S.data, null, 1), remote ? remote.sha : null, msg + ' (merged)', s.token);
    }
    dirtyNow.forEach(k => S.dirtyDays.delete(k));
    if (profNow) S.profileDirty = false;
    if (!S.dirtyDays.size && !S.profileDirty) LS.del(outboxKey()); else writeOutbox();
    setSync('ok');
  } catch (e) {
    console.error(e);
    writeOutbox();
    setSync('err', e.message);
    if (e.status === 401) toast('GitHub token expired — update it in Profile → App settings.', 'bad');
    S.retryTimer = setTimeout(syncNow, 20000);
  } finally {
    S.saving = false;
    if (S.pendingSave) { S.pendingSave = false; syncNow(); }
  }
}
window.addEventListener('hashchange', () => { if (S.screen === 'main') maybeHashWeight(); });
window.addEventListener('online', () => { if (S.dirtyDays.size || S.profileDirty) syncNow(); });

async function refreshFromGitHub(quiet) {

    if (f && f.sha !== S.sha) { S.data = JSON.parse(f.text); S.data.days = S.data.days || {}; S.sha = f.sha; if (!S.sheet) render(); if (!quiet) toast('Updated from GitHub'); }
  } catch (e) { /* ignore background refresh errors */ }
}

function formVals(sel) { const o = {}; new FormData($(sel)).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); return o; }

const CFG_PHRASE = 'fittracker-app-config-v2';
const DATA_REPO_DEFAULT = 'fittracker-data';
let CONFIG = null; // { owner, appRepo, dataRepo, token, apiKey, model }

async function pwHash(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256);
  return bytesToB64(new Uint8Array(bits));
}
async function loadConfig() {
  const sr = siteRepo() || LS.get('ft_site');
  let text = null;
  if (sr) { try { const f = await GH.get(sr.owner, sr.repo, 'config.json'); if (f) text = f.text; } catch (e) { if (e.offline) throw e; } }
  if (!text) { try { const r = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) {} }
  if (!text) return null;
  const pub = JSON.parse(text);
  const sec = await decryptVault(pub.sealed, CFG_PHRASE);
  return { owner: pub.owner, appRepo: pub.appRepo, dataRepo: pub.dataRepo, ...sec };
}
async function writeConfig(owner, appRepo, dataRepo, secret, msg) {
  const existing = await GH.get(owner, appRepo, 'config.json', secret.token);
  const sealed = await encryptVault(secret, CFG_PHRASE);
  await GH.put(owner, appRepo, 'config.json', JSON.stringify({ v: 2, owner, appRepo, dataRepo, sealed }, null, 1), existing && existing.sha, msg, secret.token);
}
function sessionFor(u) {
  const c = CONFIG;
  return { username: u, owner: c.owner, appRepo: c.appRepo, dataRepo: c.dataRepo, dataPath: `data/${u}.json`, token: c.token, apiKey: c.apiKey || '', geminiKey: c.geminiKey || '', model: c.model || DEFAULT_MODEL };
}

async function doSetup(btn) {
  const f = formVals('#setupForm'), sr = siteRepo();
  const owner = sr ? sr.owner : f.owner, appRepo = sr ? sr.repo : f.appRepo, dataRepo = DATA_REPO_DEFAULT;
  if (!owner || !appRepo) throw fail('Enter your GitHub username and app repo name.');
  if (!f.token) throw fail('Paste your GitHub token.');
  busy(btn, 'Checking GitHub…');
  const [app, data] = await Promise.all([GH.repo(owner, appRepo, f.token), GH.repo(owner, dataRepo, f.token)]);
  if (app.permissions && app.permissions.push === false) throw fail(`Token can't write to "${appRepo}". Give it Contents: Read and write.`);
  if (data.permissions && data.permissions.push === false) throw fail(`Token can't write to "${dataRepo}". Give it Contents: Read and write.`);
  if (!data.private) throw fail(`Make the "${dataRepo}" repo private first.`);
  busy(btn, 'Saving…');
  const secret = { token: f.token, apiKey: f.apiKey || '', geminiKey: f.geminiKey || '', model: DEFAULT_MODEL };
  await writeConfig(owner, appRepo, dataRepo, secret, 'FitTracker setup');
  if (!sr) LS.set('ft_site', { owner, repo: appRepo });
  CONFIG = { owner, appRepo, dataRepo, ...secret };
  S.screen = 'auth'; S.authMode = 'create'; render();
  toast('Setup done — now create your account', 'good');
}

async function doCreate(btn) {
  const f = formVals('#createForm');
  const u = (f.username || '').toLowerCase();
  if (!/^[a-z0-9][a-z0-9_.-]{2,29}$/.test(u)) throw fail('Username: 3–30 letters or numbers, no spaces.');
  if ((f.password || '').length < 6) throw fail('Password must be at least 6 characters.');
  if (!CONFIG) throw fail('App is not set up yet.');
  busy(btn, 'Creating account…');
  const c = CONFIG, path = `users/${u}.json`;
  if (await GH.get(c.owner, c.dataRepo, path, c.token)) throw fail('That username is taken — log in instead.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const rec = { username: u, salt: bytesToB64(salt), iter: PBKDF2_ITER, hash: await pwHash(f.password, salt, PBKDF2_ITER), created: new Date().toISOString() };
  await GH.put(c.owner, c.dataRepo, path, JSON.stringify(rec, null, 1), null, `Create account ${u}`, c.token);
  toast('Account created', 'good');
  await startSession(sessionFor(u), true);
}

async function doLogin(btn) {
  const f = formVals('#loginForm');
  const u = (f.username || '').toLowerCase();
  if (!u || !f.password) throw fail('Enter username and password.');
  if (!CONFIG) throw fail('App is not set up yet.');
  busy(btn, 'Signing in…');
  const c = CONFIG;
  const r = await GH.get(c.owner, c.dataRepo, `users/${u}.json`, c.token);
  if (!r) throw fail('No account with that username.');
  const rec = JSON.parse(r.text);
  if (await pwHash(f.password, b64ToBytes(rec.salt), rec.iter || PBKDF2_ITER) !== rec.hash) throw fail('Wrong password.');
  await startSession(sessionFor(u), true);
}

function rememberUser(u) {
  LS.set('ft_user', u);
  try { document.cookie = 'ft_user=' + encodeURIComponent(u) + '; max-age=31536000; path=/; SameSite=Lax; Secure'; } catch (e) {}
}
function rememberedUser() {
  const a = LS.get('ft_user'); if (a) return a;
  try { const m = document.cookie.match(/(?:^|; )ft_user=([^;]+)/); return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; }
}
function forgetUser() {
  LS.del('ft_user');
  try { document.cookie = 'ft_user=; max-age=0; path=/; SameSite=Lax; Secure'; } catch (e) {}
}
async function startSession(secret, keep) {
  S.session = secret;
  rememberUser(secret.username);
  SS.set('ft_session', secret);
  LS.set('ft_session', secret); // always stay signed in until Log out
  await loadData();
}

async function loadData() {
  S.screen = 'loading'; S.loadingMsg = 'Loading your data from GitHub…'; render();
  if (!CONFIG) { try { CONFIG = await loadConfig(); } catch (e) {} }
  if (CONFIG) Object.assign(S.session, { owner: CONFIG.owner, appRepo: CONFIG.appRepo, dataRepo: CONFIG.dataRepo, token: CONFIG.token, apiKey: CONFIG.apiKey || '', geminiKey: CONFIG.geminiKey || '', model: CONFIG.model || DEFAULT_MODEL });
  const s = S.session;
  try {
    const f = await GH.get(s.owner, s.dataRepo, s.dataPath, s.token);
    if (f) { S.data = JSON.parse(f.text); S.sha = f.sha; } else { S.data = { version: 1, profile: null, days: {} }; S.sha = null; }
    S.data.days = S.data.days || {};
    const hadOutbox = applyOutbox();
    S.screen = S.data.profile ? 'main' : 'onboard';
    S.tab = 'home'; S.date = todayStr();
    render();
    if (S.data.profile) maybeHashWeight();
    if (hadOutbox) syncNow(); else setSync('ok');
  } catch (e) {
    S.screen = 'error'; S.errorMsg = e.message; render();
  }
}

function logout() {
  if ((S.dirtyDays.size || S.profileDirty) && !confirm('Some changes are not saved to GitHub yet. Log out anyway?')) return;
  SS.del('ft_session'); LS.del('ft_session'); forgetUser();
  Object.assign(S, { session: null, data: null, sha: null, screen: 'auth', authMode: 'login', sheet: null, dirtyDays: new Set(), profileDirty: false, sync: 'idle' });
  render();
}

function tabbar() {
  const t = [['home', 'Home'], ['today', 'Today'], ['food', 'Intake'], ['burn', 'Burn'], ['meds', 'Meds'], ['suggest', 'Suggest'], ['profile', 'Profile']];
  return `<nav class="tabbar"><div class="tabbar-in">${t.map(([id, l]) => `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-v="${id}">${ICONS[id]}${l}</button>`).join('')}</div></nav>`;
}
function header(title) { return `<header class="top"><div class="top-in"><h1>${title}</h1>${syncPill()}</div></header>`; }

function healthyFat(sex, age) { // Gallagher et al. healthy body-fat ranges
  if (sex === 'male') return age < 40 ? [8, 19] : age < 60 ? [11, 21] : [13, 24];
  return age < 40 ? [21, 32] : age < 60 ? [23, 33] : [24, 35];
}
function fatCat(pct, rng) {
  if (pct < rng[0]) return ['Low', 'warn'];
  if (pct <= rng[1]) return ['Healthy', 'good'];
  if (pct <= rng[1] + 6) return ['High', 'warn'];
  return ['Very high', 'bad'];
}

function dailyCharts(p, last) {
  const days = [];
  for (let ds = last, i = 0; ds >= p.startDate && i < 14; ds = addDays(ds, -1), i++) days.unshift(ds);
  if (!days.length) return '<p class="muted" style="margin:0">Your plan starts ' + niceDate(p.startDate) + '.</p>';
  const st = days.map(ds => dayStats(ds));
  const W = 340, L = 30, R = 6, n = days.length, slot = (W - L - R) / Math.max(n, 7), bw = Math.min(12, slot * 0.34);
  const lbl = (ds, i) => (n <= 7 || i % 2 === 0 || i === n - 1) ? `<text x="${L + slot * i + slot / 2}" y="TT" text-anchor="middle">${parseD(ds).getDate()}</text>` : '';
  // chart 1: eaten vs burned (body + exercise)
  const H1 = 170, T1 = 8, B1 = 20, max1 = Math.max(1000, ...st.map(s => Math.max(s.intake, s.base + s.exNet + s.stepsK))) * 1.08;
  const Y1 = v => T1 + (1 - v / max1) * (H1 - T1 - B1);
  let g1 = '';
  for (let k = 0; k <= 3; k++) { const v = Math.round(max1 * k / 3 / 100) * 100, y = Y1(v); g1 += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${v >= 1000 ? r1(v / 1000) + 'k' : v}</text>`; }
  st.forEach((s, i) => {
    const cx = L + slot * i + slot / 2, x1 = cx - bw - 1, x2 = cx + 1;
    if (s.logged) g1 += `<rect x="${x1}" y="${Y1(s.intake)}" width="${bw}" height="${Y1(0) - Y1(s.intake)}" rx="2" fill="var(--bad)"/>`;
    const body = s.base, ex = s.exNet + s.stepsK;
    g1 += `<rect x="${x2}" y="${Y1(body)}" width="${bw}" height="${Y1(0) - Y1(body)}" rx="2" fill="var(--blue)"/>`;
    if (ex > 0) g1 += `<rect x="${x2}" y="${Y1(body + ex)}" width="${bw}" height="${Y1(body) - Y1(body + ex)}" rx="2" fill="var(--accent)"/>`;
    g1 += lbl(days[i], i).replace('TT', H1 - 6);
  });
  // chart 2: grams lost per day
  const H2 = 140, T2 = 14, B2 = 20, vals = st.map(s => s.deficit == null ? null : s.deficit / 7.7);
  const mx = Math.max(50, ...vals.filter(v => v != null).map(Math.abs)) * 1.15;
  const hasNeg = vals.some(v => v != null && v > 0); // loss bars go below the line
  const zero = hasNeg ? T2 + (H2 - T2 - B2) / 2 : H2 - B2;
  const sc = (hasNeg ? (H2 - T2 - B2) / 2 : (H2 - T2 - B2)) / mx;
  let g2 = `<line x1="${L}" x2="${W - R}" y1="${zero}" y2="${zero}" stroke="var(--muted)" stroke-width=".6"/>`;
  vals.forEach((v, i) => {
    const cx = L + slot * i + slot / 2, w = Math.min(18, slot * 0.6);
    if (v != null) {
      const hgt = Math.abs(v) * sc, up = v < 0, y = up ? zero - hgt : zero; // gain = up (red), loss = down (green)
      g2 += `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="${Math.max(1, hgt)}" rx="2" fill="${up ? 'var(--bad)' : 'var(--accent)'}"/>`;
      if (n <= 10) g2 += `<text x="${cx}" y="${up ? y - 3 : y + hgt + 9}" text-anchor="middle" style="font-weight:600">${up ? '+' : v > 0 ? '−' : ''}${r0(Math.abs(v))}</text>`;
    }
    g2 += lbl(days[i], i).replace('TT', H2 - 6);
  });
  g2 += `<text x="${L - 4}" y="${zero + 3}" text-anchor="end">0 g</text>`;
  return `<p style="margin:0 0 4px;font-weight:650;font-size:14px">Eaten vs burned (kcal)</p>
    <svg class="chart" viewBox="0 0 ${W} ${H1}">${g1}</svg>
    <div class="legend"><span><i style="background:var(--bad)"></i>eaten</span><span><i style="background:var(--blue)"></i>body uses</span><span><i style="background:var(--accent)"></i>burned</span></div>
    <p style="margin:16px 0 4px;font-weight:650;font-size:14px">Weight change each day (grams)</p>
    <svg class="chart" viewBox="0 0 ${W} ${H2}">${g2}</svg>
    <div class="legend"><span><i style="background:var(--bad)"></i>gain ↑</span><span><i style="background:var(--accent)"></i>loss ↓</span><span>last ${n} day${n > 1 ? 's' : ''} · date of month below</span></div>`;
}

function todayTable(date) {
  const st = dayStats(date), nd = nutritionNeeds(date), dn = dayNutrition(date).tot, rda = microRDA(P());
  const fmt = v => Math.abs(v) < 10 && Math.round(v) !== v ? r1(v) : r0(v).toLocaleString('en-IN');
  const head = x => `<tr><td colspan="5" style="text-align:left;padding-top:14px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800">${x}</td></tr>`;
  const row = (label, need, ate, u, limit) => {
    const bal = need - ate, pct = need > 0 ? ate / need * 100 : 0;
    let cls, word;
    if (limit) { cls = bal >= 0 ? 'good' : 'bad'; word = bal >= 0 ? 'left' : 'over'; }
    else { cls = bal <= 0 ? 'good' : pct >= 40 ? 'warnc' : 'bad'; word = bal <= 0 ? 'done ✓' : 'short'; }
    return `<tr><td>${label}</td><td>${limit && (label === 'Sugar' || label === 'Sodium') ? '≤ ' : ''}${fmt(need)} <small class="muted">${u}</small></td><td>${fmt(ate)} <small class="muted">${u}</small></td>
      <td class="${cls}"><b>${bal <= 0 && !limit ? '' : fmt(Math.abs(bal))}</b>${bal <= 0 && !limit ? '' : '<br>'}<small>${word}</small></td><td>${pctBar(ate, need, limit)}</td></tr>`;
  };
  return `<div class="card" style="padding:10px">
    <table class="fit today-t">
      <thead><tr><th></th><th>Target</th><th>You ate</th><th>Balance</th><th>%</th></tr></thead>
      <tbody>
        ${head('Nutrition')}
        ${row('Calories', nd.kcal, dn.kcal, 'kcal', true)}
        ${row('Protein', nd.protein, dn.protein, 'g', false)}
        ${row('Carbs', nd.carbs, dn.carbs, 'g', true)}
        ${row('Sugar', nd.sugar, dn.sugar, 'g', true)}
        ${row('Fat', nd.fat, dn.fat, 'g', true)}
        ${row('Fibre', nd.fiber, dn.fiber, 'g', false)}
        ${head('Vitamins')}
        ${row('Vit A', rda.vitA, dn.vitA, 'µg', false)}
        ${row('Vit C', rda.vitC, dn.vitC, 'mg', false)}
        ${row('Vit B12', rda.vitB12, dn.vitB12, 'µg', false)}
        ${row('Folate', rda.folate, dn.folate, 'µg', false)}
        ${head('Minerals')}
        ${row('Calcium', rda.calcium, dn.calcium, 'mg', false)}
        ${row('Iron', rda.iron, dn.iron, 'mg', false)}
        ${row('Magnesium', rda.magnesium, dn.magnesium, 'mg', false)}
        ${row('Potassium', rda.potassium, dn.potassium, 'mg', false)}
        ${row('Zinc', rda.zinc, dn.zinc, 'mg', false)}
        ${row('Sodium', rda.sodium, dn.sodium, 'mg', true)}
      </tbody>
    </table>
    <p class="explain">Calories, carbs, sugar, fat and sodium: above 100% turns <b class="bad">red</b>. Protein, fibre, vitamins and minerals: try to reach 100%. Calorie target = what your body uses (${r0(st.base)}) + exercise (${r0(st.exNet + st.stepsK)}) − ${r0(dailyTarget().need)} kcal cut for your goal.</p>
  </div>`;
}

function medAdvice(date) {
  let when = null, list = null;
  const td = (S.data.days[date] || {}).meds, yd = (S.data.days[addDays(date, -1)] || {}).meds;
  if (td && td.taken === 'yes' && (td.list || []).length) { when = 'today'; list = td.list; }
  else if (yd && yd.taken === 'yes' && (yd.list || []).length) { when = 'yesterday'; list = yd.list; }
  if (!list) return '';
  const names = list.map(x => x.name).join(', '), txt = names.toLowerCase();
  const has = (...w) => w.some(x => txt.includes(x));
  let tip;
  if (has('dolo', 'paracetamol', 'crocin', 'calpol', 'pacimol', 'p 650', 'p-650')) tip = 'usually taken for fever or body pain — today and tomorrow keep exercise light (walk only, no heavy gym), eat normal light meals like idli, rice-rasam, curd rice and fruit (don\'t cut calories hard) and drink 2.5–3 L water.';
  else if (has('amox', 'azith', 'augmentin', 'cefix', 'cipro', 'doxy', 'antibiotic', 'ofloxacin', 'metronidazole')) tip = 'an antibiotic — rest more and keep workouts light, eat curd/buttermilk for your stomach, drink plenty of water, and finish the full course.';
  else if (has('inhaler', 'asthalin', 'salbutamol', 'budecort', 'foracort', 'seroflo', 'montelukast', 'montair', 'levolin', 'duolin', 'deriphyllin')) tip = 'for breathing — warm up 10 minutes, keep cardio moderate, carry your inhaler to the gym, and avoid dusty or cold places.';
  else if (has('pan', 'pantop', 'omepr', 'rabepr', 'razo', 'rantac', 'ranitidine', 'digene', 'gelusil', 'esomep')) tip = 'for acidity — eat small meals, avoid spicy, fried food, tea/coffee on an empty stomach, and wait 2 hours after eating before your workout.';
  else if (has('cetiriz', 'levocet', 'allegra', 'fexofen', 'avil', 'okacet', 'montek')) tip = 'an allergy tablet that can make you sleepy — keep today\'s workout light and avoid heavy weights if you feel drowsy.';
  else if (has('ibupro', 'combiflam', 'brufen', 'diclo', 'voveran', 'aceclo', 'zerodol', 'naproxen')) tip = 'a painkiller — take it after food, rest the painful area and do only light exercise that doesn\'t hurt.';
  else if (has('metformin', 'glycomet', 'glimep', 'sitaglip', 'januvia', 'insulin', 'vildag')) tip = 'for blood sugar — don\'t skip meals, eat carbs with protein, keep a snack handy and check sugar before long workouts.';
  else if (has('amlod', 'telmis', 'losartan', 'atenolol', 'metoprolol', 'olmesar', 'cilnid')) tip = 'for BP — keep salt low, avoid holding your breath while lifting, and choose moderate cardio.';
  else if (has('thyronorm', 'eltroxin', 'thyrox', 'levothy')) tip = 'for thyroid — take it on an empty stomach and wait 30–60 minutes before breakfast or coffee.';
  else if (has('vitamin', 'vit d', 'calcium', 'shelcal', 'b12', 'iron', 'multivit', 'becosules', 'zinc')) tip = 'a supplement — take it after a meal; you can train and eat as per your normal plan.';
  else tip = 'so follow your doctor\'s advice, keep exercise light if you feel unwell, and eat simple home food.';
  return `<div class="note info" style="margin:4px 0 12px">💊 You took <b>${esc(names)}</b> ${when} — ${tip} <small>(General tip, not medical advice.)</small></div>`;
}

function viewHome() {
  const p = P(), pl = plan(), t = todayStr(), tg = dailyTarget();
  const notStarted = pl.sinceStart < 0, finished = pl.sinceStart >= pl.N;
  const lost = p.startWeight - pl.curW;
  const lossPct = Math.min(100, Math.max(0, lost / p.targetLoss * 100));
  const dayPct = Math.min(100, Math.max(0, pl.dayN / pl.N * 100));
  const endTxt = niceDate(pl.end, { day: 'numeric', month: 'short', year: 'numeric' });

  // body now vs goal
  const hM = p.heightCm / 100, fr = healthyFat(p.sex, p.age);
  const bNow = bmiOf(pl.curW, p.heightCm), [bcN, bcNc] = bmiCat(bNow);
  const bGoal = bmiOf(pl.targetW, p.heightCm), [bcG, bcGc] = bmiCat(bGoal);
  const fatGoalKg = Math.max(0, pl.fatKg - Math.max(0, pl.curW - pl.targetW));
  const fatGoalPct = fatGoalKg / pl.targetW * 100;
  const [fcN, fcNc] = fatCat(pl.fatNowPct, fr), [fcG, fcGc] = fatCat(fatGoalPct, fr);
  const wLo = 18.5 * hM * hM, wHi = 22.9 * hM * hM;

  // target card
  // body needs & eat target fixed; burn = what's needed to hit the goal
  const eatT = tg.eat, burnT = burnTarget(tg);
  const diff = tg.base + burnT - eatT; // body needs + exercise − eat
  const grams = diff / 7.7;
  let pace = '';
  if (pl.projByDeficit != null && !notStarted) {
    const off = pl.projByDeficit - pl.targetW;
    pace = `<div class="note ${off <= 0.3 ? 'good' : 'warn'}">At your current pace (${pl.avg >= 0 ? 'deficit' : 'surplus'} ${r0(Math.abs(pl.avg))} kcal/day) you'd be <b>${r1(pl.projByDeficit)} kg</b> on ${endTxt}${off <= 0.3 ? ' — on track ✓' : ` — ${r1(off)} kg above goal`}.</div>`;
  }
  const targetHtml = tg.done ? `<p class="good" style="margin:0"><b>You've reached your goal weight! 🎉</b> Eat about ${r0(tg.base)} kcal/day plus what you burn to stay here.</p>` : `
    <div class="kv"><span>Your body needs every day</span><span>${r0(tg.base).toLocaleString('en-IN')} kcal</span></div>
    <div class="kv"><span>You eat up to</span><span class="good">${eatT.toLocaleString('en-IN')} kcal</span></div>
    <div class="kv"><span>You need to burn <small>(exercise &amp; steps)</small></span><span class="warnc">${burnT.toLocaleString('en-IN')} kcal</span></div>
    <div class="kv"><span>Difference (deficit)</span><span>${r0(diff).toLocaleString('en-IN')} kcal</span></div>
    <div class="grid2" style="margin-top:12px">
      <div class="stat"><small>Weight loss each day</small><div class="big2 good">${r0(grams)} g</div><span>${r1(grams * 7 / 1000)} kg a week</span></div>
      <div class="stat"><small>Weight on ${niceDate(pl.end, { day: 'numeric', month: 'short' })}</small><div class="big2">${r1(pl.curW - diff * pl.daysLeft / 7700)} kg</div><span>if you follow this daily</span></div>
    </div>
    ${pace}
    ${tg.need > 1000 ? `<div class="note warn">This pace is aggressive. Consider a later end date in Profile.</div>` : ''}`;

  const last = t > pl.end ? pl.end : t;

  return header(`Hi${p.name ? ', ' + esc(p.name.split(' ')[0]) : ''}`) + `<main>
    <div class="card">
      <small class="muted">${notStarted ? `Starts ${niceDate(p.startDate)}` : finished ? 'Plan complete' : `Day ${pl.dayN} of ${pl.N}`}</small>
      <div class="hero" style="margin-top:6px;align-items:center">
        <div><small class="muted">Starting weight</small><div class="big2">${r1(p.startWeight)} <span style="font-size:16px;color:var(--muted)">kg</span></div><small class="muted">${niceDate(p.startDate, { day: 'numeric', month: 'short' })}</small></div>
        <div style="font-size:22px;color:var(--muted)">→</div>
        <div style="text-align:right"><small class="muted">Target weight</small><div class="big2 good">${r1(pl.targetW)} <span style="font-size:16px;color:var(--muted)">kg</span></div><small class="muted">by ${endTxt}</small></div>
      </div>
      <div class="bar"><i style="width:${lossPct}%"></i></div>
      <div class="row" style="justify-content:space-between;margin-top:8px;font-size:14px"><span>Now <b>${r1(pl.curW)} kg</b></span><span class="${lost >= 0 ? 'good' : 'bad'}"><b>${lost >= 0 ? '−' : '+'}${r1(Math.abs(lost))} kg</b> of ${r1(p.targetLoss)} kg</span></div>
      <div class="bar blue" style="height:4px;margin-top:8px"><i style="width:${dayPct}%"></i></div>
      <small class="muted">${pl.daysLeft} days left</small>
    </div>

    ${quickCard(t)}

    <div class="section-label">Your body · now vs goal</div>
    <div class="card" style="padding:12px">
      <table class="fit">
        <thead><tr><th></th><th>Now</th><th>At goal</th><th>Healthy</th></tr></thead>
        <tbody>
          <tr><td>Weight</td><td>${r1(pl.curW)} kg</td><td>${r1(pl.targetW)} kg</td><td>${r0(wLo)}–${r0(wHi)} kg</td></tr>
          <tr><td>BMI</td><td>${r1(bNow)}<br><span class="tag ${bcNc}">${bcN}</span></td><td>${r1(bGoal)}<br><span class="tag ${bcGc}">${bcG}</span></td><td>18.5–22.9</td></tr>
          <tr><td>Body fat</td><td>${r1(pl.fatNowPct)}%<br><span class="tag ${fcNc}">${fcN}</span></td><td>${r1(fatGoalPct)}%<br><span class="tag ${fcGc}">${fcG}</span></td><td>${fr[0]}–${fr[1]}%</td></tr>
          <tr><td>Fat mass</td><td>${r1(pl.fatKg)} kg</td><td>${r1(fatGoalKg)} kg</td><td>${r0(pl.targetW * fr[0] / 100)}–${r0(pl.targetW * fr[1] / 100)} kg</td></tr>
        </tbody>
      </table>
      <p class="explain">${pl.targetW > wHi ? `For a healthy BMI your weight should be about ${r0(wHi)} kg or less.` : 'Your goal weight is in the healthy range. 👍'}</p>
    </div>

    <div class="section-label">Your daily target</div>
    <div class="card">${targetHtml}</div>

    <div class="section-label">Every day</div>
    <div class="card">${dailyCharts(p, last)}</div>

    <div class="card"><h3>Weight &amp; forecast</h3>${weightChart(p, pl)}</div>
  </main>`;
}

function summaryCard(st) {
  const def = st.deficit;
  return `<div class="card">
    <div class="sum-grid">
      <div><small class="muted">Eaten</small><b>${r0(st.intake)}</b><span>kcal</span></div>
      <div><small class="muted">Burned</small><b class="good">${r0(st.exNet + st.stepsK)}</b><span>kcal exercise &amp; steps</span></div>
      <div><small class="muted">${def != null && def < 0 ? 'Surplus' : 'Deficit'}</small><b class="${def == null ? '' : def >= 0 ? 'good' : 'bad'}">${def == null ? '—' : r0(Math.abs(def))}</b><span>kcal</span></div>
    </div>
    <div class="sum-foot ${def == null ? 'muted' : def >= 0 ? 'good' : 'bad'}">${def == null ? 'Add your food to see the deficit' : def >= 0 ? `≈ ${r0(def / 7.7)} g of fat burned` : `≈ ${r0(-def / 7.7)} g gained`}</div>
    <details><summary>How the deficit is worked out</summary>
      <div class="explain">
        <div><span>Your body uses just to live (rest + daily life)</span><span>${r0(st.base)}</span></div>
        <div><span>+ Workouts</span><span>${r0(st.exNet)}</span></div>
        <div><span>+ Steps</span><span>${r0(st.stepsK)}</span></div>
        <div><span>− Eaten</span><span>${r0(st.intake)}</span></div>
        <p style="margin:6px 0 0">1 kg of body fat ≈ 7,700 kcal. These are estimates — your weigh-ins are the real check.</p>
      </div>
    </details>
  </div>`;
}

/* ================= SUGGESTIONS ================= */
function burnTarget(tg) { tg = tg || dailyTarget(); return tg.done ? 0 : Math.max(0, Math.round((tg.eat - tg.base + tg.need) / 10) * 10); }
function dailyTarget() {
  const p = P(), pl = plan(), t = todayStr();
  const base = bmr(p, pl.curW) * 1.1, minEat = p.sex === 'male' ? 1500 : 1200;
  const daysLeft = Math.max(0, diffDays(t < p.startDate ? p.startDate : t, pl.end) + (t < p.startDate ? 1 : 0));
  const toLose = pl.curW - pl.targetW;
  if (toLose <= 0 || daysLeft <= 0) return { eat: Math.round(base / 10) * 10, burn: 250, need: 0, base, done: toLose <= 0 };
  const need = toLose * KCAL_PER_KG / daysLeft;
  let ex7 = 0, exN = 0;
  for (let i = 1; i <= 7; i++) { const ds = addDays(t, -i); if (ds < p.startDate) break; const st = dayStats(ds); if (st.logged || st.exShow) { ex7 += st.exShow; exN++; } }
  let burn = Math.max(400, exN ? ex7 / exN : 0), eat = base + burn * 0.85 - need;
  if (eat < minEat) { burn = (minEat - base + need) / 0.85; eat = minEat; }
  return { eat: Math.round(eat / 10) * 10, burn: Math.round(burn / 10) * 10, need, base };
}
function healthFlags(p) {
  const txt = ((p.health || []).join(' ') + ' ' + (p.healthNotes || '')).toLowerCase();
  const has = (...w) => w.some(x => txt.includes(x));
  return { diabetes: has('diab', 'sugar', 'pcos'), bp: has('bp', 'pressure', 'hypertens'), chol: has('cholest'),
    acid: has('acid', 'gastr', 'ulcer', 'reflux'), joint: has('knee', 'back', 'joint', 'arthrit'), heart: has('heart', 'cardiac'),
    breath: has('asthma', 'breath', 'airway', 'copd', 'wheez'), thyroid: has('thyroid') };
}

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(fail('Could not open that image.')); };
    img.src = url;
  });
}

async function addPhotosToSheet(files, slot) {
  const sh = S.sheet; if (!sh) return;
  const ph = (sh.photos || []).slice(0, 2);
  let i = slot;
  for (const f of files) {
    if (i > 1) break;
    try { ph[i] = await resizeImage(f, 1024); } catch (e) { toast(e.message, 'bad'); }
    i++;
  }
  sh.photos = ph.filter(Boolean).slice(0, 2);
  if (sh.kind === 'food') { sh.items = []; sh.note = ''; sh.error = ''; } else if (sh.kind === 'scale') { sh.res = null; sh.err = ''; } else { sh.detectNote = ''; sh.detectErr = ''; }

}

function workoutPrompt() {
  return `This photo was taken in a gym. Identify the exercise machine or equipment in it.
Pick the closest "type" id from this list: ${WORKOUTS.map(w => w.id + ' = ' + w.name).join('; ')}.
If the machine has a display screen, read the numbers shown on it:
- elapsed time → "minutes" as a decimal number (e.g. 25:30 → 25.5)
- speed → "speed" in km/h (if the screen shows mph, multiply by 1.609)
- incline → "incline" in %
- calories → "kcal"
- watts → "watts"; resistance/level → put it in "note"
Guess "intensity" as "light", "moderate" or "hard" from speed/level if possible, else "moderate".
Reply with ONLY a JSON object, no other text:
{"type":"treadmill","machine":"what you see, e.g. Life Fitness treadmill","minutes":null,"speed":null,"incline":null,"kcal":null,"watts":null,"intensity":"moderate","note":"one short sentence"}
Use null for any number you cannot clearly see. If there is no gym equipment, use "type":"other" and explain in "note".
You may get 2 photos of the same workout (e.g. the machine and a close-up of its screen) — use both.`;
}
function openWorkoutSheet() {
  S.sheet = { kind: 'workout', editId: null, photos: [], busy: false, detectNote: '', detectErr: '',
    w: { type: 'treadmill', minutes: null, speed: null, incline: null, intensity: 1, watts: null, kcal: null, manual: false } };
}
async function startWorkoutPhoto(file, append) {   // kept for tests: adds a photo, then detects
  if (!(append && S.sheet && S.sheet.kind === 'workout')) openWorkoutSheet();
  await addPhotosToSheet([file], (S.sheet.photos || []).length);
  return runWorkoutDetect();
}
async function runWorkoutDetect() {
  const sh = S.sheet; if (!sh || !(sh.photos || []).length) return;
  const s = S.session;
  if (!s.geminiKey && !s.apiKey) { sh.busy = false; sh.changeKey = true; renderSheet(); return; }
  sh.busy = true; sh.detectNote = ''; sh.detectErr = ''; renderSheet();
  const photos = sh.photos.slice();
  try {
    const text = await askVision(photos.map(p => p.split(',')[1]), workoutPrompt());
    const mt = text.match(/\{[\s\S]*\}/); if (!mt) throw fail('Could not read the AI answer — pick the machine yourself.');
    const d = JSON.parse(mt[0]);
    if (S.sheet !== sh) return;
    const n = x => (x == null || x === '' || isNaN(Number(x))) ? null : Number(x);
    const type = WK[d.type] ? d.type : 'other', w = sh.w, kg = weightOn(S.date);
    w.type = type; if (type === 'other') w.name = d.machine || 'Workout';
    w.minutes = n(d.minutes); w.speed = n(d.speed); w.incline = n(d.incline); w.watts = n(d.watts);
    w.intensity = { light: 0, moderate: 1, hard: 2 }[String(d.intensity || '').toLowerCase()] ?? 1;
    const k = n(d.kcal);
    if (k != null) { w.kcal = r0(k); w.manual = true; } else { w.kcal = r0(wkSuggest(w, kg)); w.manual = false; }
    const read = [];
    if (w.minutes != null) read.push(r1(w.minutes) + ' min');
    if (w.speed != null) read.push(r1(w.speed) + ' km/h');
    if (w.incline != null) read.push(r1(w.incline) + '% incline');
    if (k != null) read.push(r0(k) + ' kcal');
    const ask = [];
    if (w.minutes == null) ask.push('minutes');
    if (WK[type].calc === 'tread' && w.speed == null) ask.push('speed');
    sh.detectNote = `Detected: <b>${esc(WK[type].name)}</b>${d.machine && type !== 'other' ? ` <small>(${esc(d.machine)})</small>` : ''}.<br>` +
      (read.length ? `Read from the screen: <b>${esc(read.join(', '))}</b>.` : 'No numbers found on a screen.') +
      (ask.length ? ` Please enter the <b>${ask.join(' and ')}</b> below.` : '') + ' Check everything, then tap <b>Save workout</b>.';
  } catch (e) { if (S.sheet === sh) sh.detectErr = e.message + ' You can still pick the machine below.'; }
  if (S.sheet === sh) { sh.busy = false; renderSheet(); }
}

    ${fields}
    <div class="card" style="margin-top:4px">
      <p class="sugg" id="wkSugg">${m.calc === 'custom' ? 'Enter the calories from your watch or machine.' : `Suggested: <b>${sugg} kcal</b> for ${r1(kg)} kg body weight`}</p>
      <label>Calories burned (edit if your machine shows different)<input type="number" step="any" inputmode="decimal" id="wkKcal" data-wf="kcal" value="${w.kcal ?? (m.calc === 'custom' ? '' : sugg)}"></label>
      ${w.manual && m.calc !== 'custom' ? `<p style="margin:8px 0 0"><button class="muted" style="font-size:13px;text-decoration:underline" data-act="wkReset">Use suggested value</button></p>` : ''}

function onWorkoutInput(t) {
  const w = S.sheet.w, k = t.dataset.wf, kg = weightOn(S.date), m = WK[w.type];
  if (k === 'name') { w.name = t.value; return; }

function renderSheet() {
  const root = $('#sheet-root');
  if (!S.sheet) { root.innerHTML = ''; document.body.classList.remove('lock'); return; }
  const inner = S.sheet.kind === 'food' ? sheetFood() : S.sheet.kind === 'confirm' ? sheetConfirm() : S.sheet.kind === 'scale' ? sheetScale() : S.sheet.kind === 'weight' ? sheetAddWeight() : S.sheet.kind === 'steps' ? sheetSteps() : S.sheet.kind === 'wheyq' ? sheetWheyQ() : sheetWorkout();
  const existing = $('.sheet', root);

  else root.innerHTML = `<div class="sheet-backdrop" data-act="closeSheet" data-backdrop="1"><div class="sheet"><div class="grab"></div>${inner}</div></div>`;

function toTop() { const a = $('#app'); if (a) a.scrollTop = 0; window.scrollTo(0, 0); }

  wheyQStep(el) { const s = S.sheet; s.n = Math.min(5, Math.max(0.5, Math.round((s.n + Number(el.dataset.v)) * 2) / 2)); renderSheet(); },
  saveWheyQ() {
    const n = S.sheet.n, wd = wheyDefaults(), t = todayStr();
    mutateDay(t, d => { d.meals = d.meals || []; d.meals.push({ id: uid(), slot: 'whey', name: `Whey protein (${n} scoop${n == 1 ? '' : 's'})`, grams: r1(n * wd.g), scoops: n,
      kcal: r0(n * wd.k), protein: r1(n * WHEY_P), carbs: r1(n * wd.g * 0.08), fat: r1(n * wd.g * 0.05), source: 'wheyq', at: new Date().toISOString() }); });
    S.sheet = null; toast(`Saved ${n} scoop${n == 1 ? '' : 's'} = ${r1(n * WHEY_P)} g protein`, 'good'); render();
  },
  openSteps() {
    S.sheet = { kind: 'steps', at: new Date() }; renderSheet();

  },
  saveStepAdd() {
    const n = num(($('#stepAddIn') || {}).value);
    if (n == null || n <= 0 || n > 100000) throw fail('Enter the steps you walked.');
    const at = S.sheet.at, ds = fmtD(at), kc = r0(n * stepKcal(weightOn(ds)));
    mutateDay(ds, d => {
      const log = stepLogOf(d).slice(); log.push({ id: uid(), at: at.toISOString(), steps: Math.round(n), kcal: kc });
      d.stepLog = log; d.steps = log.reduce((a, x) => a + x.steps, 0); d.stepsKcal = r0(log.reduce((a, x) => a + (x.kcal != null ? x.kcal : x.steps * stepKcal(weightOn(ds))), 0));
    });
    toast(`Saved ${Math.round(n).toLocaleString('en-IN')} steps = ${kc} kcal`, 'good');
    S.sheet = { kind: 'steps', at: new Date() }; render();
  },
  delStepAdd(el) {
    const ds = fmtD(S.sheet.at);
    mutateDay(ds, d => {
      const log = stepLogOf(d).filter(x => String(x.id) !== el.dataset.id);
      d.stepLog = log; d.steps = log.reduce((a, x) => a + x.steps, 0) || undefined;
      d.stepsKcal = log.length ? r0(log.reduce((a, x) => a + (x.kcal != null ? x.kcal : x.steps * stepKcal(weightOn(ds))), 0)) : undefined;

  homeWorkout() {
    S.date = todayStr();

  },
  openAddWeight() {

  },
  saveAddWeight() {
    const w = num(($('#addWeightIn') || {}).value);

    const at = S.sheet.at, ds = fmtD(at);
    mutateDay(ds, d => { d.weight = r1(w); d.weightAt = at.toISOString(); });

  },
  confirmWeight() {
    const sh = S.sheet;

  },
  addWorkout() {
    const last = Object.keys(S.data.days).sort().reverse().map(k => (S.data.days[k].workouts || [])[0]).find(Boolean);
    const type = last ? last.type : 'treadmill';
    S.sheet = { kind: 'workout', editId: null, w: { type, minutes: 30, speed: last && last.speed || 6, incline: last && last.incline || 0, intensity: 1, watts: null, kcal: null, manual: false } };

  wkType(el) {
    const w = S.sheet.w; w.type = el.dataset.v; w.manual = false;

  wkReset() { const w = S.sheet.w; w.manual = false; w.kcal = r0(wkSuggest(w, weightOn(S.date))); renderSheet(); },
  editWorkout(el) {

  },
  saveWorkout() {
    const sh = S.sheet, w = sh.w, m = WK[w.type];

    const kcal = num(($('#wkKcal') || {}).value);
    if (kcal == null || kcal < 0) throw fail('Enter calories burned.');
    const rec = { id: sh.editId || uid(), type: w.type, name: m.calc === 'custom' ? (w.name || 'Workout').trim() : m.name, minutes: r1(w.minutes), kcal: r0(kcal), suggested: r0(wkSuggest(w, weightOn(S.date))) };

  deleteWorkout() {

  closeSheet() { S.sheet = null; renderSheet(); },
  changeKey() { S.sheet.changeKey = true; renderSheet(); },
  async saveGemini(el) {

  async exportXlsx(el) {
    busy(el, 'Preparing Excel…');
    try {
      if (!window.XLSX) await new Promise((ok, bad) => {
        const sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        sc.onload = ok; sc.onerror = () => bad(fail('Could not load the Excel tool — check your internet.'));
        document.head.appendChild(sc);
      });
      const p = P(), days = Object.keys(S.data.days).sort();
      const R = v => v == null || v === '' ? '' : Math.round(v * 10) / 10;
      const summary = [], meals = [], works = [], micro = [], medsRows = [];
      days.forEach(ds => {
        const st = dayStats(ds), d = S.data.days[ds] || {}, dn = dayNutrition(ds), t = dn.tot;
        const dayNo = diffDays(p.startDate, ds) + 1;
        summary.push({ Date: ds, 'Plan day': dayNo >= 1 ? dayNo : '', 'Weight (kg)': d.weight ?? '', 'Eaten (kcal)': R(t.kcal), 'Protein (g)': R(t.protein), 'Carbs (g)': R(t.carbs), 'Sugar (g)': R(t.sugar), 'Fat (g)': R(t.fat), 'Fibre (g)': R(t.fiber),
          'Workouts (kcal)': R(st.exGross), 'Workout minutes': (d.workouts || []).reduce((a, x) => a + (x.minutes || 0), 0), Steps: d.steps ?? '', 'Steps (kcal)': R(st.stepsK),
          'Body uses (kcal)': R(st.base), 'Total burned (kcal)': R(st.burn), 'Deficit (kcal)': st.deficit == null ? '' : R(st.deficit), 'Fat lost (g)': st.deficit == null ? '' : R(st.deficit / 7.7),
          'Meals logged': (d.meals || []).length, 'Body fat % (scale)': (d.body || {}).fat ?? '', 'Muscle % (scale)': (d.body || {}).muscle ?? '', 'Water % (scale)': (d.body || {}).water ?? '', 'Visceral fat': (d.body || {}).visceral ?? '', Remark: d.remark || '' });
        micro.push({ Date: ds, 'Vitamin A (µg)': R(t.vitA), 'Vitamin C (mg)': R(t.vitC), 'Vitamin B12 (µg)': R(t.vitB12), 'Folate (µg)': R(t.folate), 'Calcium (mg)': R(t.calcium), 'Iron (mg)': R(t.iron), 'Magnesium (mg)': R(t.magnesium), 'Potassium (mg)': R(t.potassium), 'Zinc (mg)': R(t.zinc), 'Sodium (mg)': R(t.sodium) });
        (d.meals || []).forEach(m => {
          const mi = microOfMeal(m) || {};
          meals.push({ Date: ds, Meal: slotLabel(m.slot), Food: m.name, 'Grams': R(m.grams), kcal: R(m.kcal), 'Protein (g)': R(m.protein), 'Carbs (g)': R(m.carbs), 'Fat (g)': R(m.fat), 'Fibre (g)': R(mi.fiber), 'Sugar (g)': R(mi.sugar),
            'Calcium (mg)': R(mi.calcium), 'Iron (mg)': R(mi.iron), 'Vit C (mg)': R(mi.vitC), 'Sodium (mg)': R(mi.sodium), Source: { ai: 'Photo AI', list: 'Food list', suggest: 'Suggestion', manual: 'Manual' }[m.source] || (m.source || 'Manual') });
        });
        if (d.meds) medsRows.push({ Date: ds, 'Taken?': { yes: 'Yes', no: 'No', none: 'No medicine' }[d.meds.taken] || '', Medicines: (d.meds.list || []).map(x => [x.name, x.dose, x.time].filter(Boolean).join(' ')).join('; '), Photos: (d.meds.photos || []).length, Remark: d.meds.remark || '' });
        (d.workouts || []).forEach(w => works.push({ Date: ds, Equipment: w.name, Minutes: R(w.minutes), 'Speed (km/h)': w.speed ?? '', 'Incline (%)': w.incline ?? '', Effort: w.intensity != null ? INTENSITY[w.intensity] : '', kcal: R(w.kcal) }));
      });
      const pl = plan();
      const prof = [['Name', p.name || ''], ['Username', S.session.username], ['Sex', p.sex], ['Age', p.age], ['Height (cm)', p.heightCm], ['Starting weight (kg)', p.startWeight],
        ['Goal: lose (kg)', p.targetLoss], ['Goal: days', p.targetDays], ['Start date', p.startDate], ['End date', pl.end], ['Target weight (kg)', R(pl.targetW)],
        ['Current weight (kg)', R(pl.curW)], ['Body fat now (est. %)', R(pl.fatNowPct)], ['Food preference', p.diet || 'nonveg'], ['Health issues', (p.health || []).join(', ')], ['Exported on', new Date().toLocaleString('en-IN')]];
      const wb = XLSX.utils.book_new();
      const add = (rows, name, widths) => {
        const ws = Array.isArray(rows[0]) ? XLSX.utils.aoa_to_sheet(rows) : XLSX.utils.json_to_sheet(rows.length ? rows : [{ Note: 'No data yet' }]);
        if (widths) ws['!cols'] = widths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      add(summary, 'Daily summary', [11, 8, 11, 11, 10, 9, 9, 8, 9, 14, 14, 8, 11, 15, 17, 13, 11, 12, 30]);
      add(meals, 'Meals', [11, 10, 28, 8, 7, 10, 9, 8, 9, 9, 11, 9, 9, 11, 11]);
      add(micro, 'Vitamins & minerals', [11, 13, 13, 15, 11, 12, 10, 14, 14, 10, 12]);
      add(works, 'Workouts', [11, 30, 9, 12, 11, 10, 8]);
      add(medsRows, 'Medication', [11, 12, 50, 8, 40]);
      add([['Field', 'Value'], ...prof], 'Profile', [22, 40]);
      XLSX.writeFile(wb, `Minimal-Health-${S.session.username}-${todayStr()}.xlsx`);
      toast('Excel downloaded', 'good');
    } finally { unbusy(el); }
  },
  exportCsv() {
    const p = P(), rows = [['date', 'weight_kg', 'intake_kcal', 'protein_g', 'burn_kcal', 'workout_kcal', 'steps', 'sleep_h', 'water_ml', 'deficit_kcal', 'remark']];

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.backdrop && e.target !== el) return;      // clicks inside the sheet
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || String(err), 'bad'); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.closest && t.closest('#pf')) return updateProfilePreview();
  if (t.id === 'stepAddIn') { const k = $('#stepAddK'); const v = num(t.value); if (k) k.textContent = `≈ ${r0((v || 0) * stepKcal(weightOn(fmtD(S.sheet.at))))} kcal burned`; return; }
  if (t.id === 'stepsIn') { const k = $('#stepsKcal'); const v = num(t.value); if (k && !k.dataset.manual) k.value = v == null ? '' : r0(v * stepKcal(weightOn(S.date))); return; }
  if (t.id === 'stepsKcal') { t.dataset.manual = '1'; return; }
  if (t.dataset.it != null) return onItemInput(t);
  if (t.dataset.wf) return onWorkoutInput(t);
  if (t.id === 'foodQuery') { S.sheet.query = t.value; const r = $('#searchResults'); if (r) r.innerHTML = searchResults(t.value); }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.classList.contains('scale-photo-input') && t.files && t.files[0]) {
    const files = [...t.files].slice(0, 2), slot = Number(t.dataset.slot || 0); t.value = '';
    if (!(S.sheet && S.sheet.kind === 'scale')) openScaleSheet();
    await addPhotosToSheet(files, slot); return;
  }
  if (t.classList.contains('food-check-input') && t.files && t.files[0]) {
    const files = [...t.files].slice(0, 2); t.value = '';
    const hr = new Date().getHours(), slot = hr < 11 ? 'breakfast' : hr < 16 ? 'lunch' : hr < 19 ? 'snacks' : 'dinner';
    S.sheet = { kind: 'food', check: true, slot, mode: 'photo', items: [], photos: [], busy: false, note: '', error: '' };
    await addPhotosToSheet(files, 0); return;
  }
  if (t.classList.contains('med-photo-input') && t.files && t.files[0]) {
    const f = t.files[0]; t.value = ''; const date = S.date, s = S.session;
    try {
      toast('Uploading photo…');
      const url = await resizeImage(f, 1000), b64 = url.split(',')[1];
      const path = `photos/${s.username}/${date}-${uid()}.jpg`;
      await GH.putB64(s.owner, s.dataRepo, path, b64, `Medicine photo ${date}`, s.token);
      PHOTO_CACHE[path] = url;
      mutateDay(date, d => { d.meds = d.meds || {}; d.meds.photos = d.meds.photos || []; d.meds.photos.push(path); });
      toast('Photo saved', 'good'); render();
    } catch (err) { toast(err.message || 'Could not upload photo', 'bad'); }
    return;
  }
  if (t.classList.contains('wk-photo-input') && t.files && t.files[0]) {
    const files = [...t.files].slice(0, 2), slot = Number(t.dataset.slot || 0); t.value = '';
    if (t.dataset.home) S.date = todayStr();
    if (!(S.sheet && S.sheet.kind === 'workout')) openWorkoutSheet();
    await addPhotosToSheet(files, t.dataset.slot != null ? slot : (S.sheet.photos || []).length); return;
  }
  if (t.classList.contains('photo-input') && t.files && t.files[0]) {
    const files = [...t.files].slice(0, 2), slot = Number(t.dataset.slot || 0); t.value = '';
    await addPhotosToSheet(files, slot);
    return;
  }
  if (t.id === 'wkTypeSel') { ACT.wkType({ dataset: { v: t.value } }); return; }
  if (t.dataset.wf) onWorkoutInput(t);
  if (t.closest && t.closest('#pf')) updateProfilePreview();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'stepAddIn') { e.preventDefault(); const b = $('[data-act=saveStepAdd]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'addWeightIn') { e.preventDefault(); const b = $('[data-act=saveAddWeight]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target.closest && (e.target.closest('#loginForm') || e.target.closest('#createForm') || e.target.closest('#setupForm'))) {
    e.preventDefault(); const b = $('#loginForm [data-act=login], #createForm [data-act=create], #setupForm [data-act=setup]'); if (b) b.click();
  }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
async function boot() {
  const saved = SS.get('ft_session') || LS.get('ft_session');
  if (saved && saved.token && saved.username && saved.dataPath) { S.session = saved; return loadData(); }
  S.screen = 'loading'; S.loadingMsg = 'Starting…'; render();
  try { CONFIG = await loadConfig(); }
  catch (e) { if (e.offline) { S.screen = 'error'; S.errorMsg = e.message; return render(); } CONFIG = null; }
  const u = rememberedUser();
  if (CONFIG && u) { S.session = sessionFor(u); return loadData(); }   // stay signed in
  S.screen = CONFIG ? 'auth' : 'setup'; render();
}
boot();

})();
